name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo-dev cmake libffi-dev libssl-dev
      
      - name: Install Buildozer
        run: |
          pip3 install --user --upgrade buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          # Root check ကို လုံးဝပိတ်ပါ
          export BUILDOZER_NO_CHECK_ROOT=1
          
          # NDK 404 Error မတက်အောင် လှည့်စားခြင်း (Buildozer က ဒေါင်းလုပ်ဆွဲစရာမလိုတော့ပါ)
          export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724
          
          # 'yes |' က မေးခွန်းအားလုံးကို အလိုအလျောက် 'y' ဖြစ်သွားအောင် လုပ်ပေးပါလိမ့်မယ်
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
