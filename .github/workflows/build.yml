name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with Buildozer
        uses: kivy/buildozer@master
        with:
          args: android debug
        env:
          # ဒီ variable တွေက root check ကို ပိတ်ဖို့အတွက် အဓိကကျပါတယ်
          BUILDOZER_ALLOW_ROOT: "1"
          BUILDOZER_NO_CHECK_ROOT: "1"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
