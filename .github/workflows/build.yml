name: Build with Docker

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with Docker
        run: |
          # Dockerfile ကိုသုံးပြီး build လုပ်ခြင်း
          docker build -t kivy-build .
          docker run --rm -v $(pwd):/home/user/host kivy-build
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: bin/*.apk
