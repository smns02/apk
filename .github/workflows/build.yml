name: Build Kivy Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential
        pip3 install --upgrade buildozer cython

    - name: Build with Buildozer
      run: |
        # Buildozer က SDK/NDK တွေကို အလိုအလျောက် သတ်မှတ်ပေးဖို့အတွက်
        # ပထမဆုံးအကြိမ်မှာ လိုင်စင်တွေ အလိုအလျောက်လက်ခံဖို့ ဒီ command ကိုသုံးပါ
        export ANDROID_HOME=$HOME/.android/sdk
        export ANDROID_NDK_HOME=$HOME/.android/ndk
        
        # buildozer.spec ထဲကအတိုင်း build စတင်ခြင်း
        buildozer -v android debug
      env:
        # လိုင်စင်အလိုအလျောက် သဘောတူရန်
        ANDROID_ACCEPT_SDK_LICENSE: 1

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk
