name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with Buildozer
        uses: kivy/buildozer@master
        with:
          # ဒီနေရာမှာ 'yes |' ကို ထည့်လိုက်ပါ
          args: yes | buildozer android debug
        env:
          # ဒီစာကြောင်းက root နဲ့ run တဲ့အခါ အလိုအလျောက် အတည်ပြုပေးမှာပါ
          BUILDOZER_ALLOW_ROOT: 1
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
