name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          # libtinfo5 ကို libtinfo-dev နဲ့ အစားထိုးလိုက်ပါတယ်
          sudo apt-get install -y python3-pip git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo-dev cmake libffi-dev libssl-dev
          pip3 install --upgrade buildozer
          
      - name: Build APK
        run: |
          # Buildozer ကို non-interactive ဖြစ်အောင် ဒီလိုရေးပါ
          export BUILDOZER_NO_CHECK_ROOT=1
          yes | buildozer android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
