name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Buildozer
        uses: kivy/buildozer@master
        with:
          args: android debug
        env:
          # ဒီစာကြောင်းက Buildozer ကို root နဲ့ run တဲ့အခါ မေးခွန်းမထုတ်ဖို့ တားပေးတာပါ
          BUILDOZER_ALLOW_ROOT: 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
