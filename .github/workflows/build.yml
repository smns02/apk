name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with Docker
        uses: docker://kivy/buildozer:latest
        with:
          args: /bin/bash -c "pip install --upgrade buildozer && buildozer android debug"
        env:
          BUILDOZER_NO_CHECK_ROOT: "1"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
