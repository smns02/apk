name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with Buildozer
        uses: kivy/buildozer@master
        with:
          # အဓိကအချက်မှာ အောက်ပါအတိုင်း command ကို ရေးပေးခြင်းဖြစ်သည်
          args: android debug
        env:
          # Buildozer ရဲ့ root check ကို ပိတ်ပစ်ခြင်း
          BUILDOZER_ALLOW_ROOT: "1"
          # အရေးကြီးဆုံး: Buildozer ကို script ပုံစံဖြင့် non-interactive run စေခြင်း
          # ဒီအချက်က input() မတောင်းအောင် တားဆီးပေးပါလိမ့်မယ်
          PYTHONUNBUFFERED: "1"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
