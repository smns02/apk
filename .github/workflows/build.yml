name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo-dev cmake libffi-dev libssl-dev
          pip3 install --upgrade buildozer
          
      - name: Build APK
        run: |
          # 1. Root check ကို ပိတ်ပါ
          export BUILDOZER_NO_CHECK_ROOT=1
          
          # 2. GitHub Actions မှာရှိပြီးသား NDK နဲ့ SDK path ကို Buildozer သုံးအောင်လုပ်ပါ
          export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724
          export ANDROID_SDK_HOME=/usr/local/lib/android/sdk
          
          # 3. အရေးကြီးဆုံး: Buildozer ကို သူ့ဘာသာသူ ဒေါင်းလုပ်မဆွဲခိုင်းတော့ဘဲ 
          # ရှိပြီးသား Path ကို အသိအမှတ်ပြုခိုင်းခြင်း
          rm -rf .buildozer
          
          # 4. Build စတင်ခြင်း
          yes | buildozer android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
