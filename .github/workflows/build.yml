name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with Buildozer
        uses: kivy/buildozer@master
        with:
          args: android debug
        env:
          BUILDOZER_NO_CHECK_ROOT: "1"
          # အရေးကြီးဆုံး: Buildozer က သူ့ဘာသာ ဖိုင်တွေ ဒေါင်းလုပ်ဆွဲတာကို ပိတ်ပေးခြင်း
          # ဒါက Error 404 ကို တားဆီးပေးပါလိမ့်မယ်
          # GitHub Runner မှာရှိတဲ့ NDK ကိုပဲ သုံးခိုင်းပါ
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
