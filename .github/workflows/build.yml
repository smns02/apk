name: Build with Docker

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Docker
        run: |
          docker build -t kivy-build .
          # BUILDOZER_ALLOW_ROOT=1 ကို ထည့်ပေးရပါမယ်
          docker run --rm -v $(pwd):/home/user/host -e BUILDOZER_ALLOW_ROOT=1 kivy-build

          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: bin/*.apk
