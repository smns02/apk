name: Build Kivy Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential
        pip3 install --upgrade buildozer cython

    - name: Build with Buildozer
      run: |
        # အဟောင်းတွေကို ရှင်းထုတ်ပြီးမှ အသစ် build ပါ
        buildozer clean
        # Buildozer ကို verbose mode (-v) နဲ့ run ပါမှ error အစစ်ကို မြင်ရမှာပါ
        buildozer -v android debug
      env:
        ANDROID_ACCEPT_SDK_LICENSE: 1


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk
