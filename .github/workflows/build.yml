name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with Buildozer
        uses: docker://kivy/buildozer:latest
        with:
          # NDK ကို သူ့ဘာသာ မဒေါင်းစေရန် လိုအပ်သော environment များကို ကြိုတင်သတ်မှတ်ပေးခြင်း
          args: /bin/bash -c "pip install --upgrade buildozer && buildozer android debug"
        env:
          BUILDOZER_NO_CHECK_ROOT: "1"
          # အဓိကအချက်: GitHub Runner ရဲ့ NDK Path ကို ညွှန်းပေးလိုက်ခြင်း
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_NDK_PATH: /usr/local/lib/android/sdk/ndk/27.3.13750724
