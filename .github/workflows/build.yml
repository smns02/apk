name: Build Kivy Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip3 install --upgrade buildozer cython

    - name: Build with Buildozer
      run: |
        # SDK Licenses ကို ကြိုတင်လက်ခံခြင်း
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # Buildozer ကို အသုံးပြု၍ APK ထုတ်ခြင်း
        buildozer android debug
      env:
        # Buildozer က လိုင်စင်ကို အလိုအလျောက်လက်ခံအောင် ကူညီပေးခြင်း
        ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk
