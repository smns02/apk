name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with Buildozer
        uses: kivy/buildozer@master
        with:
          # ဒီ args က ပိုပြီးသေချာပါတယ်
          args: android debug
        env:
          # ဤ variable နှစ်ခုလုံးကို ထည့်ပေးပါ
          BUILDOZER_ALLOW_ROOT: "1"
          BUILDOZER_CHECK_ROOT: "False"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
